[project]
name = "rag-system-1"
version = "1.0.0"
description = "Production System 1: Traditional Dense Vector RAG over conversational transcripts"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.25",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "faiss-cpu>=1.7",
  "python-dotenv>=1.0",
  "pydantic-settings",
]

[project.optional-dependencies]
embeddings-st = ["sentence-transformers>=2.0"]
test = ["pytest>=8.0"]
all = ["sentence-transformers>=2.0", "pytest>=8.0"]

[tool.pytest.ini_options]
markers = [
  "live: requires local Ollama with qwen3.5:4b-mlx (RUN_LIVE_OLLAMA_TESTS=1)",
]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
